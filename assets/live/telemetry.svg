<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="t d">
  <title id="t">Live GitHub telemetry for Ajitkumar-1001</title>
  <desc id="d">
    1699 contributions in the last 12 months, current streak 69 days, longest streak 80 days, active
    on 259 days, busiest day 106. 24 original public repos, 19 stars. Top languages by repo: Jupyter
    Notebook 43%, Python 36%, TypeScript 36%, CSS 21%, JavaScript 21%.
  </desc>
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dbbff" stop-opacity=".35" />
      <stop offset="1" stop-color="#7dbbff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6fc4" />
      <stop offset="1" stop-color="#7dbbff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    svg{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:16px}
    text{fill:#9fb3d1}
    .txt{fill:#e6eefc}
    .mut{fill:#9fb3d1}
    .acc{fill:#7dbbff}
    .end{text-anchor:end}
    .num{fill:#e6eefc;font-weight:700}
    .bg{fill:#000000}
    .card{fill:#050b16;stroke:#0b1f3a;stroke-width:2}
    .rule{stroke:#0b1f3a;stroke-width:2}
    .grid{stroke:#0b1f3a;stroke-width:1.5}
    .track{fill:#0b1f3a}
    .hud{fill:none;stroke:#7dbbff;stroke-width:2}
    .trend{fill:none;stroke:#1e90ff;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    .dot{fill:#7dbbff}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}}
    @keyframes draw{from{stroke-dashoffset:1}}
    @keyframes grow{from{transform:scaleX(0)}}
    @keyframes pulse{50%{opacity:.3}}
    .rise{animation:rise .4s ease-out backwards}
    .draw{stroke-dasharray:1;animation:draw 1s ease-out .4s backwards}
    .bar{transform-box:fill-box;transform-origin:left center;animation:grow .6s ease-out backwards}
    .live{animation:pulse 2s ease-in-out 2}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
